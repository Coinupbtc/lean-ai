<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lean audit · orch, Oct 20–28</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0e13; --ink-2: #12151c; --ink-3: #1a1e27; --paper: #ece8df; --acid: #c8f54a;
    --mute: #8b9287; --line: color-mix(in srgb, var(--paper) 14%, transparent);
    --c-system: #6f7a8c; --c-tools: #4f86a8; --c-wip: #c8f54a; --c-asst: #e0a458; --c-user: #b48ead; --c-gap: #2a2f39;
    --display: Fraunces, Georgia, serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
    --pad: clamp(1rem, 4vw, 3rem);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--paper); font: .92rem/1.65 var(--mono); overflow-x: hidden; }
  .wrap { width: min(980px, 100%); margin-inline: auto; padding: 0 var(--pad) 3rem; }
  header { padding: 2.2rem 0 1.4rem; border-bottom: 1px solid var(--line); }
  .kicker { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  h1 { font: 700 clamp(1.9rem, 6vw, 3.2rem)/1.02 var(--display); letter-spacing: -.03em; margin: .6rem 0 .5rem; }
  h1 em { font-style: normal; color: var(--acid); }
  h2 { font: 500 1.3rem/1.2 var(--display); margin: 2.6rem 0 .3rem; }
  .sub { color: var(--mute); font-size: .8rem; margin-bottom: 1rem; max-width: 70ch; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 1.4rem; }
  .stat { background: var(--ink); padding: .9rem 1rem; }
  .stat b { display: block; font: 500 1.55rem/1.1 var(--display); color: var(--paper); font-variant-numeric: tabular-nums; }
  .stat span { font-size: .7rem; color: var(--mute); letter-spacing: .06em; }
  .stat.hot b { color: var(--acid); }
  .bar { display: flex; height: 44px; width: 100%; border-radius: 3px; overflow: hidden; margin: 1rem 0 .7rem; background: var(--c-gap); }
  .bar div { height: 100%; min-width: 2px; transition: opacity .15s; }
  .bar div:hover { opacity: .8; }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .35rem 1.2rem; font-size: .8rem; }
  .legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; margin-right: .45rem; vertical-align: -1px; }
  .legend .v { color: var(--mute); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1rem; margin-top: 1rem; }
  .card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 1rem 1.1rem 1.1rem; }
  .card .lean { font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .card .num { font: 500 1.9rem/1.1 var(--display); margin: .35rem 0 .15rem; font-variant-numeric: tabular-nums; }
  .card.big { border-color: color-mix(in srgb, var(--acid) 55%, transparent); }
  .card.big .num { color: var(--acid); }
  .card .what { font-size: .82rem; }
  .card .note { font-size: .74rem; color: var(--mute); margin-top: .5rem; }
  .rows { margin-top: 1rem; }
  .row { display: grid; grid-template-columns: 9.5rem 1fr 6rem; align-items: center; gap: .8rem; font-size: .8rem; padding: .22rem 0; }
  .row .track { background: var(--ink-3); height: 14px; border-radius: 2px; overflow: hidden; }
  .row .fill { height: 100%; background: var(--acid); }
  .row .fill.cool { background: var(--c-tools); }
  .row .n { text-align: right; color: var(--mute); font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; margin-top: 1rem; font-size: .8rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--mute); font-weight: 500; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; }
  td.hot { color: var(--acid); }
  td.cold { color: var(--mute); }
  .check { margin-top: 1rem; font-size: .78rem; color: var(--mute); border-left: 2px solid var(--acid); padding-left: .9rem; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .72rem; color: var(--mute); }
  a { color: var(--acid); text-underline-offset: 3px; }
  @media (max-width: 560px) {
    .row { grid-template-columns: 6.5rem 1fr 4.5rem; gap: .5rem; }
    table.inv { min-width: 0; }
    table.inv th:nth-child(4), table.inv td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const R = {"tool": "leanaudit 0.1.0", "generated": "2026-10-28T23:28:28-05:00", "label": "orch, Oct 20\u201328", "window": {"since": "2026-10-20", "until": "2026-10-28T23:20"}, "tokenizer": "exact", "profiles": {"orchestrator": 212}, "totals": {"sessions": 212, "api_calls": 10369, "tool_calls": 13133, "prompt": 1359379771, "uncached": 139820347, "cached": 1219559424, "output": 8114276, "reasoning": 4377718, "aux_prompt": 34966941}, "headline": {"read_per_write": 172, "value_ratio_pct": 0.58, "prompt_per_call": 131100, "system_prompt_tokens_median": 12424, "tool_schema_tokens": 8567, "tool_count": 19}, "wastes": [{"key": "overprocessing", "lean": "Overprocessing", "what": "Fixed prefix re-sent on every model call (system prompt + tool schemas)", "tokens": 209269536, "share_of_prompt": 15.4, "note": "System prompt measured per session from its exact text; tool schemas measured today and applied to every call in the window."}, {"key": "wip", "lean": "Inventory (WIP)", "what": "Tool output carried in context and re-read by every later call in the session", "tokens": 690973667, "share_of_prompt": 50.8, "note": "Each tool-output token was re-read 54.1\u00d7 on average. Reasoning text is not counted."}, {"key": "waiting", "lean": "Waiting", "what": "Prompt tokens the engine had to compute (cache miss) on engines that report cache", "tokens": 139152852, "share_of_prompt": 10.2, "note": "0.0% of prompt tokens ran in sessions with zero reported cache reads (engine doesn't report hits); left out, not called waste."}, {"key": "inspection", "lean": "Inspection", "what": "Scheduled runs that checked and found nothing to say ([SILENT]) + after-session reviews", "tokens": 49865454, "share_of_prompt": 3.6, "note": "Necessary non-value-added: the Lean move is cheaper inspection, not no inspection."}, {"key": "defects", "lean": "Defects", "what": "Tool calls the tool itself reported as failed, and runs that died with no output", "tokens": 0, "count": 125, "rate": 1.0, "share_of_prompt": 0.0, "note": "223 non-zero shell exits are excluded (grep exits 1 on no match)."}, {"key": "motion", "lean": "Motion", "what": "Tool calls identical (same tool, same arguments) to an earlier call in the same session", "count": 133, "rate": 1.0, "note": "Some repeats are legitimate (re-running a test after a fix); this is the ceiling, not the floor."}, {"key": "inventory", "lean": "Inventory (idle stock)", "what": "Tool schemas shipped on every call but never called in the window", "tokens": 5091179, "count": 2, "share_of_prompt": 0.4, "note": "See the inventory table: tokens shipped per actual use, per tool."}], "outcome_split": {"delivered_or_chat": 1344034821, "silent_inspection": 15344950, "dead_runs": 0, "aux": 34966941, "cron_runs": 87, "silent_runs": 9, "dead_sessions": 0}, "prefix_split": {"system": 120438313, "tools": 88831223, "conversation": 1150110235}, "wip": {"history_reread": 975150458, "tool_output": 690973667, "assistant": 242804331, "user": 41372460, "tool_output_written": 12764491, "tool_output_reread_x": 54.1, "top_carried_tools": [{"tool": "terminal", "tokens": 266016849, "share": 38.5}, {"tool": "read_file", "tokens": 240683220, "share": 34.8}, {"tool": "patch", "tokens": 77028176, "share": 11.1}, {"tool": "execute_code", "tokens": 75658976, "share": 10.9}, {"tool": "vision_analyze", "tokens": 13003232, "share": 1.9}, {"tool": "skill_view", "tokens": 4359253, "share": 0.6}, {"tool": "write_file", "tokens": 3070802, "share": 0.4}, {"tool": "search_files", "tokens": 2810710, "share": 0.4}], "self_check": {"modeled_prompt": 1184419994, "measured_prompt": 1359379771, "modeled_over_measured": 0.871}}, "cache": {"reporting_models": ["deepseek-v4.1-flash"], "miss_pct_reporting": 10.2, "unreported_prompt": 667495}, "aux": {"background_review": {"calls": 198, "prompt": 34520504, "output": 300723}, "vision": {"calls": 527, "prompt": 387271, "output": 266884}, "title_generation": {"calls": 102, "prompt": 47187, "output": 1556}, "approval": {"calls": 24, "prompt": 11979, "output": 96}}, "by_source": {"oneshot": {"sessions": 100, "prompt": 966330857, "output": 5639477, "api_calls": 6490}, "telegram": {"sessions": 13, "prompt": 178774585, "output": 871498, "api_calls": 1208}, "cron": {"sessions": 87, "prompt": 145534526, "output": 1038980, "api_calls": 2002}, "subagent": {"sessions": 12, "prompt": 68739803, "output": 564321, "api_calls": 669}}, "tool_results": {"total": 13133, "failed": 125, "failed_pct": 1.0, "nonzero_exit": 223, "top_failed": [{"tool": "write_file", "failed": 34, "of": 587, "pct": 5.8}, {"tool": "execute_code", "failed": 23, "of": 956, "pct": 2.4}, {"tool": "patch", "failed": 21, "of": 2885, "pct": 0.7}, {"tool": "terminal", "failed": 17, "of": 6309, "pct": 0.3}, {"tool": "vision_analyze", "failed": 15, "of": 542, "pct": 2.8}, {"tool": "tool_call", "failed": 4, "of": 4, "pct": 100.0}, {"tool": "read_file", "failed": 4, "of": 1479, "pct": 0.3}, {"tool": "process_manage", "failed": 3, "of": 187, "pct": 1.6}]}, "motion": {"repeats": 133, "top": [["terminal", 71], ["tool_call", 52], ["write_file", 5], ["execute_code", 2], ["delegate_task", 1], ["patch", 1]]}, "inventory": [{"tool": "delegate_task", "schema_tokens": 1056, "uses": 9, "shipped_tokens": 10949664, "tokens_per_use": 1216629}, {"tool": "skill_manage", "schema_tokens": 954, "uses": 3, "shipped_tokens": 9892026, "tokens_per_use": 3297342}, {"tool": "memory", "schema_tokens": 811, "uses": 3, "shipped_tokens": 8409259, "tokens_per_use": 2803086}, {"tool": "execute_code", "schema_tokens": 799, "uses": 956, "shipped_tokens": 8284831, "tokens_per_use": 8666}, {"tool": "browser_exec", "schema_tokens": 796, "uses": 29, "shipped_tokens": 8253724, "tokens_per_use": 284611}, {"tool": "terminal", "schema_tokens": 660, "uses": 6309, "shipped_tokens": 6843540, "tokens_per_use": 1085}, {"tool": "search_files", "schema_tokens": 574, "uses": 71, "shipped_tokens": 5951806, "tokens_per_use": 83828}, {"tool": "clarify", "schema_tokens": 415, "uses": 0, "shipped_tokens": 4303135, "tokens_per_use": null}, {"tool": "tool_search", "schema_tokens": 375, "uses": 5, "shipped_tokens": 3888375, "tokens_per_use": 777675}, {"tool": "read_file", "schema_tokens": 328, "uses": 1479, "shipped_tokens": 3401032, "tokens_per_use": 2300}, {"tool": "web_extract", "schema_tokens": 273, "uses": 13, "shipped_tokens": 2830737, "tokens_per_use": 217749}, {"tool": "write_file", "schema_tokens": 262, "uses": 587, "shipped_tokens": 2716678, "tokens_per_use": 4628}, {"tool": "patch", "schema_tokens": 237, "uses": 2885, "shipped_tokens": 2457453, "tokens_per_use": 852}, {"tool": "vision_analyze", "schema_tokens": 223, "uses": 542, "shipped_tokens": 2312287, "tokens_per_use": 4266}, {"tool": "skill_view", "schema_tokens": 219, "uses": 11, "shipped_tokens": 2270811, "tokens_per_use": 206437}, {"tool": "web_search", "schema_tokens": 207, "uses": 16, "shipped_tokens": 2146383, "tokens_per_use": 134149}, {"tool": "tool_call", "schema_tokens": 179, "uses": 207, "shipped_tokens": 1856051, "tokens_per_use": 8966}, {"tool": "tool_describe", "schema_tokens": 123, "uses": 8, "shipped_tokens": 1275387, "tokens_per_use": 159423}, {"tool": "skills_list", "schema_tokens": 76, "uses": 0, "shipped_tokens": 788044, "tokens_per_use": null}], "lead_time": {"model_step_median_s": 13.6, "tool_step_median_s": 0.2, "model_total_h": 166.6, "tool_total_h": 27.9, "model_steps": 10433, "tool_steps": 10174}, "end_reasons": {"cli_close": 100, "cron_complete": 77, "(open)": 12, "agent_close": 12, "session_reset": 11}, "whatif_prune": [{"trigger_tokens": 32000, "prompt_now": 1186064388, "prompt_with_prune": 929133758, "saved": 256930630, "saved_pct": 21.7, "prunes": 349, "recompute": 6513036, "net_saved": 250417594}, {"trigger_tokens": 48000, "prompt_now": 1186064388, "prompt_with_prune": 945357195, "saved": 240707193, "saved_pct": 20.3, "prunes": 272, "recompute": 6484980, "net_saved": 234222213}, {"trigger_tokens": 96000, "prompt_now": 1186064388, "prompt_with_prune": 982591247, "saved": 203473141, "saved_pct": 17.2, "prunes": 130, "recompute": 5608103, "net_saved": 197865038}]};
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok = (n) => { if (n == null) return '–'; const a = Math.abs(n);
  return a >= 1e9 ? (n/1e9).toFixed(2)+'B' : a >= 1e6 ? (n/1e6).toFixed(1)+'M' : a >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(Math.round(n)); };
const int = (n) => n == null ? '–' : Math.round(n).toLocaleString('en-US');
const app = document.getElementById('app');
const t = R.totals, h = R.headline, W = Object.fromEntries(R.wastes.map(w => [w.key, w]));
const readAll = t.prompt + (t.aux_prompt || 0);

app.append($(`<header>
  <div class="kicker">leanaudit · ${esc(R.label)} · ${esc(R.window.since || 'start')} → ${esc(R.window.until || 'now')}</div>
  <h1>For every token it wrote, the agent read <em>${int(h.read_per_write)}</em>.</h1>
  <p class="sub">${int(t.sessions)} sessions, ${int(t.api_calls)} model calls and ${int(t.tool_calls)} tool calls of Hermes Agent,
  sorted into the wastes a Lean engineer looks for on a factory floor. Token counts: ${esc(R.tokenizer)}.</p>
  <div class="stats">
    <div class="stat"><b>${tok(readAll)}</b><span>tokens read</span></div>
    <div class="stat"><b>${tok(t.output)}</b><span>tokens written</span></div>
    <div class="stat"><b>${int(h.prompt_per_call)}</b><span>read per model call</span></div>
    <div class="stat hot"><b>${W.wip ? W.wip.share_of_prompt + '%' : '–'}</b><span>is old tool output</span></div>
  </div>
</header>`));

// Where every prompt token goes: rebuilt from parts, remainder shown as unmodeled.
const P = R.prefix_split, X = R.wip;
const parts = [
  ['System prompt, every call', P.system, 'var(--c-system)'],
  ['Tool schemas, every call', P.tools, 'var(--c-tools)'],
  ['Old tool output, re-read', X.tool_output, 'var(--c-wip)'],
  ['Agent\'s own earlier replies', X.assistant, 'var(--c-asst)'],
  ['User messages', X.user, 'var(--c-user)'],
  ['Not rebuilt (template, reasoning replay, injected context)', Math.max(0, t.prompt - X.self_check.modeled_prompt), 'var(--c-gap)'],
].filter(p => p[1] > 0);
const sum = parts.reduce((a, p) => a + p[1], 0);
app.append($(`<section>
  <h2>Where every prompt token goes</h2>
  <p class="sub">Each model call re-reads the fixed prefix plus everything said so far. The bar rebuilds that stream message by message
  and checks it against what Hermes measured: ${(X.self_check.modeled_over_measured * 100).toFixed(1)}% accounted for.</p>
  <div class="bar" role="img" aria-label="Prompt token breakdown">${parts.map(p =>
    `<div style="flex:${p[1]};background:${p[2]}" title="${esc(p[0])}: ${tok(p[1])}"></div>`).join('')}</div>
  <div class="legend">${parts.map(p =>
    `<div><i style="background:${p[2]}"></i>${esc(p[0])} <span class="v">${tok(p[1])} · ${(100*p[1]/sum).toFixed(1)}%</span></div>`).join('')}</div>
</section>`));

// The wastes.
const numOf = (w) => w.share_of_prompt != null && w.tokens ? w.share_of_prompt + '%' : w.rate != null ? w.rate + '%' : tok(w.tokens);
const unitOf = (w) => w.share_of_prompt != null && w.tokens ? `${tok(w.tokens)} tokens` : w.count != null ? `${int(w.count)} events` : '';
app.append($(`<section>
  <h2>The waste walk</h2>
  <p class="sub">Lean's wastes, translated to an agent. Percentages are of prompt tokens unless the card counts events.</p>
  <div class="cards">${R.wastes.map(w => `<div class="card ${w.key === 'wip' ? 'big' : ''}">
    <div class="lean">${esc(w.lean)}</div>
    <div class="num">${numOf(w)}</div>
    <div class="note" style="margin:0 0 .45rem">${unitOf(w)}</div>
    <div class="what">${esc(w.what)}</div>
    <div class="note">${esc(w.note)}</div></div>`).join('')}</div>
</section>`));

// WIP by tool.
if (X.top_carried_tools && X.top_carried_tools.length) {
  const mx = X.top_carried_tools[0].tokens;
  app.append($(`<section>
    <h2>Which tools fill the context</h2>
    <p class="sub">Tool output re-read by later calls, by the tool that produced it. On average each tool-output token was read
    <b style="color:var(--acid)">${X.tool_output_reread_x}×</b> after it was first written.</p>
    <div class="rows">${X.top_carried_tools.map(r => `<div class="row"><span>${esc(r.tool)}</span>
      <div class="track"><div class="fill" style="width:${(100*r.tokens/mx).toFixed(1)}%"></div></div>
      <span class="n">${tok(r.tokens)}</span></div>`).join('')}</div>
  </section>`));
}

// Idle stock: schemas shipped vs used.
if (R.inventory && R.inventory.length) {
  const rows = [...R.inventory].sort((a, b) => (b.tokens_per_use ?? 1e18) - (a.tokens_per_use ?? 1e18));
  app.append($(`<section>
    <h2>Tool schemas: shipped vs used</h2>
    <p class="sub">Every tool's schema rides along on every call. Tokens shipped per actual use shows which ones earn their place.
    ${int(h.tool_count)} tools, ${int(h.tool_schema_tokens)} tokens per call.</p>
    <div class="scroll"><table class="inv"><thead><tr><th>Tool</th><th>Schema</th><th>Uses</th><th>Shipped</th><th>Shipped per use</th></tr></thead>
    <tbody>${rows.map(i => `<tr><td>${esc(i.tool)}</td><td>${int(i.schema_tokens)}</td><td>${int(i.uses)}</td><td>${tok(i.shipped_tokens)}</td>
      <td class="${i.tokens_per_use == null || i.tokens_per_use > 1e5 ? 'hot' : 'cold'}">${i.tokens_per_use == null ? 'never used' : tok(i.tokens_per_use)}</td></tr>`).join('')}</tbody></table></div>
  </section>`));
}

// What-if: Hermes' own proactive prune.
if (R.whatif_prune && R.whatif_prune.length) {
  app.append($(`<section>
    <h2>What if old tool output were cleared?</h2>
    <p class="sub">Hermes ships <code>compression.proactive_prune_tokens</code>, off by default. This replays every session under its
    rules: past the trigger, tool results over 8,000 characters outside the last 6 messages become one-line summaries. Each prune
    rewrites history, so the cache has to recompute from that point once.</p>
    <div class="scroll"><table><thead><tr><th>Trigger</th><th>Read now*</th><th>With prune*</th><th>Saved</th><th>Cache breaks</th><th>Recompute</th></tr></thead>
    <tbody>${R.whatif_prune.map(w => `<tr><td>${int(w.trigger_tokens)}</td><td>${tok(w.prompt_now)}</td><td>${tok(w.prompt_with_prune)}</td>
      <td class="hot">−${w.saved_pct}%</td><td>${int(w.prunes)}</td><td>${tok(w.recompute)}</td></tr>`).join('')}</tbody></table></div>
    <p class="check">Tokens only: a replay can't know whether the agent needed the text it lost. A live trial measures that,
    as repeat calls (Motion) and failed tool calls. *Both columns are the rebuilt stream, so they exclude the part not rebuilt.</p>
  </section>`));
}

// Lead time.
const L = R.lead_time;
if (L.model_steps) {
  const tot = L.model_total_h + L.tool_total_h;
  app.append($(`<section>
    <h2>Lead time: thinking vs doing</h2>
    <p class="sub">Wall time between messages: model steps (prefill, reasoning, writing, queueing) vs tool steps (running the command).
    Median model step ${L.model_step_median_s}s, median tool step ${L.tool_step_median_s}s.</p>
    <div class="rows">
      <div class="row"><span>model</span><div class="track"><div class="fill" style="width:${(100*L.model_total_h/tot).toFixed(1)}%"></div></div><span class="n">${L.model_total_h} h</span></div>
      <div class="row"><span>tools</span><div class="track"><div class="fill cool" style="width:${(100*L.tool_total_h/tot).toFixed(1)}%"></div></div><span class="n">${L.tool_total_h} h</span></div>
    </div>
  </section>`));
}

app.append($(`<footer>${esc(R.tool)} · generated ${esc(R.generated)} · read-only, aggregates only: no message text, prompts or ids.
  · <a href="https://github.com/Coinupbtc/lean-ai">github.com/Coinupbtc/lean-ai</a></footer>`));
</script>
</body>
</html>
